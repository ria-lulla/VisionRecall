name: VisionRecall
options:
  bundleIdPrefix: com.visionrecall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team in Xcode (Signing & Capabilities) before device runs.
    CODE_SIGN_STYLE: Automatic
    # DAT registration/attestation identifiers. Empty is fine in Developer Mode; fill
    # MetaAppID/ClientToken from the Wearables Developer Center for non-dev-mode builds.
    META_APP_ID: ""
    CLIENT_TOKEN: ""

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "0.9.0"

targets:
  VisionRecall:
    type: application
    platform: iOS
    sources:
      - path: VisionRecall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visionrecall.VisionRecall
        INFOPLIST_FILE: VisionRecall/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera

  VisionRecallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VisionRecallTests
    dependencies:
      - target: VisionRecall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visionrecall.VisionRecallTests
        GENERATE_INFOPLIST_FILE: YES

  VisionRecallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VisionRecallUITests
    dependencies:
      - target: VisionRecall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visionrecall.VisionRecallUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VisionRecall:
    build:
      targets:
        VisionRecall: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VisionRecallTests
        - VisionRecallUITests
